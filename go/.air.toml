root = "."
tmp_dir = "tmp"

[build]
  # Build command disesuaikan dengan entry point project Anda (cmd/api/main.go)
  cmd = "go build -o ./tmp/main ./cmd/api/main.go"
  bin = "./tmp/main"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "db/migrations"]
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_regex = ["_test\\.go"]
  stop_on_error = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[log]
  time = true
